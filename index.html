<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PACE AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#0e1012;--s1:#16191d;--s2:#1e2227;--s3:#272c33;--bd:#2b3138;--tx:#f1f3f4;--mu:#97a1ab;--mu2:#6d7681;--ac:#c8f53c;--ac-ink:#101400;--ac-tx:#c8f53c;--ac-soft:rgba(200,245,60,.12);--warn:#ffb547;--bad:#ff5d6c;--good:#5fe0a0;--info:#5bc0ff;--r:18px;--sh:0 8px 30px rgba(0,0,0,.35);
--c-easy:#4fb8f0;--c-long:#8a8cff;--c-int:#ff5d73;--c-tempo:#ffab40;--c-rec:#5fd6a6;--c-str:#b58cff;--c-rest:#5d6670;--c-race:#c8f53c;--c-hill:#ff8a65;--c-fart:#ffd54f}
html.light{--bg:#f2f3ef;--s1:#ffffff;--s2:#f0f1ec;--s3:#e5e8e0;--bd:#dde1d8;--tx:#15181b;--mu:#5c656e;--mu2:#8a929a;--ac:#c8f53c;--ac-ink:#101400;--ac-tx:#4a7400;--ac-soft:rgba(120,170,0,.12);--sh:0 6px 24px rgba(20,30,10,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
#root{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.app{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:20}
.top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px;flex:1}
.logo{font-weight:900;letter-spacing:-.5px}.logo b{color:var(--ac-tx)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--s1);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card.tight{padding:12px}
.card.hero{background:linear-gradient(145deg,var(--s2),var(--s1));}
.card.ac{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.card h3{margin:0 0 8px;font-size:16px;font-weight:700}
.sec{font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sec a,.link{color:var(--ac-tx);text-decoration:none;font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0;background:none;border:0;padding:0;font-size:14px}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:6px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.mu{color:var(--mu)}.mu2{color:var(--mu2)}.sm{font-size:13px}.xs{font-size:12px}.lg{font-size:18px}.xl{font-size:28px;font-weight:800;letter-spacing:-.5px}.b{font-weight:700}.c{text-align:center}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--s2);color:var(--tx);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s ease,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}.btn.full{width:100%}.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.big{padding:18px;font-size:17px;border-radius:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--s2);cursor:pointer;font-size:14px;user-select:none}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:transparent;font-weight:700}
.seg{display:flex;background:var(--s2);border:1px solid var(--bd);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:var(--sh)}
label.f{display:block;margin:0 0 12px}label.f>span{display:block;font-size:13px;color:var(--mu);margin:0 0 6px;font-weight:600}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);outline:none}
.inp:focus{border-color:var(--ac-tx)}
textarea.inp{min-height:76px;resize:vertical}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--s3);color:var(--mu)}
.tag.ac{background:var(--ac-soft);color:var(--ac-tx)}.tag.warn{background:rgba(255,181,71,.15);color:var(--warn)}.tag.bad{background:rgba(255,93,108,.14);color:var(--bad)}.tag.good{background:rgba(95,224,160,.14);color:var(--good)}.tag.info{background:rgba(91,192,255,.14);color:var(--info)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:8px;border-radius:99px;background:var(--s3);overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .6s ease}
.stat{background:var(--s2);border-radius:14px;padding:12px;flex:1;min-width:0}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.3px}.stat .k{font-size:12px;color:var(--mu);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.list>*+*{border-top:1px solid var(--bd)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);align-items:end}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mu);padding:6px 0;cursor:pointer;font-weight:600}
.nav button svg{width:22px;height:22px}.nav button.on{color:var(--tx)}.nav button.on svg{color:var(--ac-tx)}
.nav .run{width:52px;height:52px;border-radius:18px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;margin:-22px auto 0;box-shadow:0 6px 20px rgba(200,245,60,.35)}
.nav .run svg{width:26px;height:26px;color:var(--ac-ink)!important}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--s1);width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--s3);margin:4px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:90;font-weight:600;font-size:14px;max-width:90vw;box-shadow:var(--sh);animation:up .25s}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wkd{background:var(--s2);border-radius:12px;padding:6px 2px;text-align:center;cursor:pointer;min-height:64px;border:1.5px solid transparent;position:relative}
.wkd.today{border-color:var(--ac-tx)}.wkd .d{font-size:11px;color:var(--mu)}.wkd .n{font-weight:800;font-size:15px}
.wkd .bar2{height:4px;border-radius:4px;margin:4px 6px 0}
.mon{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mon .c{aspect-ratio:1;background:var(--s2);border-radius:9px;padding:3px;font-size:11px;position:relative;cursor:pointer;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.mon .c.out{opacity:.35}.mon .c.today{border-color:var(--ac-tx)}
.wo{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--s1);border:1px solid var(--bd);margin-bottom:8px;cursor:pointer}
.wo .stripe{width:5px;align-self:stretch;border-radius:5px}
.wo.done{opacity:.75}.wo.missed,.wo.skipped{opacity:.5}
.stage{border-inline-start:3px solid var(--bd);padding:2px 0 2px 14px;padding-inline-start:14px;padding-left:unset;margin:0 0 14px}
.stage h4{margin:0 0 4px;font-size:15px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd);gap:12px}.kv:last-child{border-bottom:0}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word}
.msg.u{background:var(--ac);color:var(--ac-ink);margin-inline-start:auto;border-end-end-radius:6px}
.msg.a{background:var(--s2);border-end-start-radius:6px}
.banner{padding:10px 14px;border-radius:14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:rgba(255,181,71,.12);color:var(--warn)}.banner.info{background:rgba(91,192,255,.1);color:var(--info)}.banner.bad{background:rgba(255,93,108,.12);color:var(--bad)}.banner.good{background:rgba(95,224,160,.12);color:var(--good)}.banner.ac{background:var(--ac-soft);color:var(--ac-tx)}
.ob{min-height:100vh;display:flex;flex-direction:column;padding:16px 0 24px}
.ob .prog{display:flex;gap:4px;margin:6px 0 18px}.ob .prog i{flex:1;height:4px;border-radius:4px;background:var(--s3)}.ob .prog i.on{background:var(--ac)}
.ob h2{font-size:26px;margin:0 0 6px;letter-spacing:-.4px}.ob .lead{color:var(--mu);margin:0 0 20px}
.opt{display:block;width:100%;text-align:start;padding:14px 16px;border-radius:16px;border:1.5px solid var(--bd);background:var(--s1);margin-bottom:10px;cursor:pointer}
.opt.on{border-color:var(--ac-tx);background:var(--ac-soft)}.opt b{display:block}.opt span{font-size:13px;color:var(--mu)}
.ring{position:relative;display:grid;place-items:center}.ring>div{position:absolute;text-align:center}
.live{position:fixed;inset:0;background:#000;color:#fff;z-index:80;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.live .big{font-size:84px;font-weight:900;letter-spacing:-3px;line-height:1}
.live .mid{font-size:34px;font-weight:800;letter-spacing:-1px}
.live .lbl{font-size:13px;color:#9aa;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.live .stagebox{background:#151515;border-radius:20px;padding:16px;border:2px solid #222}
.live .ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.live .ctl button{padding:22px;border-radius:20px;border:0;font-size:20px;font-weight:800;cursor:pointer}
.fast{color:#ff6b6b}.slow{color:#ffc04d}.ok{color:#c8f53c}
svg text{font-family:inherit}
.empty{padding:28px 16px;text-align:center;color:var(--mu)}
.badge{background:var(--s2);border-radius:16px;padding:12px 6px;text-align:center}.badge.off{opacity:.35;filter:grayscale(1)}.badge .i{font-size:26px}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
</style>
</head>

05D4\u05DE\u05E9\u05D9\u05DA \u05DC\u05E8\u05D5\u05E5 \u05DC\u05D0\u05D5\u05E8\u05DA \u05D6\u05DE\u05DF \u05D1\u05D0\u05DE\u05E6\u05E2\u05D5\u05EA \u05D7\u05DE\u05E6\u05DF.","The ability to keep running for a long time using oxygen."],ex:["\u05D6\u05D4 \u05DE\u05D4 \u05E9\u05DE\u05D0\u05E4\u05E9\u05E8 \u05DC\u05DA \u05DC\u05E8\u05D5\u05E5 10 \u05E7\u05F4\u05DE \u05D5\u05DC\u05D0 \u05E8\u05E7 1.","It\u2019s what lets you run 10 km, not just 1."]},{term:["\u05E1\u05E3 \u05DC\u05E7\u05D8\u05D8","Lactate threshold"],def:["\u05D4\u05E7\u05E6\u05D1 \u05D4\u05DE\u05D4\u05D9\u05E8 \u05D1\u05D9\u05D5\u05EA\u05E8 \u05E9\u05D1\u05D5 \u05D4\u05D2\u05D5\u05E3 \u05E2\u05D5\u05D3 \u05DE\u05E1\u05E4\u05D9\u05E7 \u05DC\u05E4\u05E0\u05D5\u05EA \u05D0\u05EA \u05EA\u05D5\u05E6\u05E8\u05D9 \u05D4\u05DE\u05D0\u05DE\u05E5. \u05DE\u05E2\u05DC\u05D9\u05D5 \u2013 \u05D4\u05E2\u05D9\u05D9\u05E4\u05D5\u05EA \u05DE\u05E6\u05D8\u05D1\u05E8\u05EA \u05DE\u05D4\u05E8.","The fastest pace where your body still clears fatigue byproducts. Above it, fatigue builds fast."],ex:["\u05D1\u05E2\u05E8\u05DA \u05D4\u05E7\u05E6\u05D1 \u05E9\u05EA\u05D5\u05DB\u05DC \u05DC\u05D4\u05D7\u05D6\u05D9\u05E7 \u05DB\u05E9\u05E2\u05D4 \u05D1\u05DE\u05E8\u05D5\u05E5.","Roughly the pace you could hold for about an hour racing."]},{term:["VO2 \u05DE\u05E7\u05E1","VO2 max"],def:['\u05DB\u05DE\u05D5\u05EA \u05D4\u05D7\u05DE\u05E6\u05DF \u05D4\u05DE\u05E8\u05D1\u05D9\u05EA \u05E9\u05D4\u05D2\u05D5\u05E3 \u05D9\u05DB\u05D5\u05DC \u05DC\u05E0\u05E6\u05DC. "\u05D4\u05EA\u05E7\u05E8\u05D4" \u05D4\u05D0\u05D9\u05E8\u05D5\u05D1\u05D9\u05EA.','The maximum oxygen your body can use. Your aerobic "ceiling".'],ex:["\u05D0\u05D9\u05E0\u05D8\u05E8\u05D5\u05D5\u05DC\u05D9\u05DD \u05E9\u05DC 3\u20135 \u05D3\u05E7\u05D5\u05EA \u05DE\u05E2\u05DC\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05E7\u05E8\u05D4 \u05D4\u05D6\u05D5.","3\u20135 minute intervals raise this ceiling."]},{term:["VDOT","VDOT"],def:["\u05DE\u05D3\u05D3 \u05DB\u05D5\u05E9\u05E8 \u05E8\u05D9\u05E6\u05D4 \u05E9\u05DE\u05D7\u05D5\u05E9\u05D1 \u05DE\u05EA\u05D5\u05E6\u05D0\u05EA \u05E8\u05D9\u05E6\u05D4 (\u05E9\u05D9\u05D8\u05EA \u05D2\u05F3\u05E7 \u05D3\u05E0\u05D9\u05D0\u05DC\u05E1). \u05D0\u05E0\u05D7\u05E0\u05D5 \u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05D5 \u05DC\u05D7\u05D9\u05E9\u05D5\u05D1 \u05D4\u05E7\u05E6\u05D1\u05D9\u05DD \u2013 \u05D4\u05D5\u05D0 \u05DC\u05D0 \u05D1\u05D3\u05D9\u05E7\u05EA \u05DE\u05E2\u05D1\u05D3\u05D4.","A running-fitness index derived from a race result (Jack Daniels\u2019 method). We use it to compute paces \u2014 it\u2019s not a lab test."],ex:["5 \u05E7\u05F4\u05DE \u05D1-25:00 \u2248 VDOT 38.","5 km in 25:00 \u2248 VDOT 38."]},{term:["\u05D8\u05DE\u05E4\u05D5","Tempo"],def:['\u05E8\u05D9\u05E6\u05D4 \u05E8\u05E6\u05D9\u05E4\u05D4 \u05D1"\u05E7\u05E9\u05D4 \u05D1\u05E0\u05D5\u05D7\u05D5\u05EA", \u05E7\u05E8\u05D5\u05D1 \u05DC\u05E1\u05E3.','A continuous "comfortably hard" run near threshold.'],ex:["20 \u05D3\u05E7\u05D5\u05EA \u05E9\u05D1\u05D4\u05DF \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D5\u05DE\u05E8 \u05E8\u05E7 \u05DB\u05DE\u05D4 \u05DE\u05D9\u05DC\u05D9\u05DD.","20 minutes where you can only say a few words."]},{term:["\u05D0\u05D9\u05E0\u05D8\u05E8\u05D5\u05D5\u05DC\u05D9\u05DD","Intervals"],def:["\u05D7\u05D6\u05E8\u05D5\u05EA \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA \u05E2\u05DD \u05D4\u05E4\u05E1\u05E7\u05D5\u05EA \u05D4\u05EA\u05D0\u05D5\u05E9\u05E9\u05D5\u05EA \u05D1\u05D9\u05E0\u05D9\u05D4\u05DF.","Fast repeats with recovery between them."],ex:["6 \xD7 400 \u05DE\u05F3 \u05E2\u05DD 90 \u05E9\u05E0\u05D9\u05D5\u05EA \u05D4\u05DC\u05D9\u05DB\u05D4.","6 \xD7 400 m with 90 s walking."]},{term:["\u05E4\u05D0\u05E8\u05D8\u05DC\u05E7","Fartlek"],def:['"\u05DE\u05E9\u05D7\u05E7 \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA" \u05D1\u05E9\u05D5\u05D5\u05D3\u05D9\u05EA \u2013 \u05E9\u05D9\u05E0\u05D5\u05D9\u05D9 \u05E7\u05E6\u05D1 \u05D7\u05D5\u05E4\u05E9\u05D9\u05D9\u05DD \u05D1\u05EA\u05D5\u05DA \u05E8\u05D9\u05E
