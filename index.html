<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PACE AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#0e1012;--s1:#16191d;--s2:#1e2227;--s3:#272c33;--bd:#2b3138;--tx:#f1f3f4;--mu:#97a1ab;--mu2:#8a939d;--ac:#c8f53c;--ac-ink:#101400;--ac-tx:#c8f53c;--ac-soft:rgba(200,245,60,.12);--warn:#ffb547;--bad:#ff5d6c;--good:#5fe0a0;--info:#5bc0ff;--r:18px;--sh:0 8px 30px rgba(0,0,0,.35);
--c-easy:#4fb8f0;--c-long:#8a8cff;--c-int:#ff5d73;--c-tempo:#ffab40;--c-rec:#5fd6a6;--c-str:#b58cff;--c-rest:#5d6670;--c-race:#c8f53c;--c-hill:#ff8a65;--c-fart:#ffd54f}
html.light{--bg:#f2f3ef;--s1:#ffffff;--s2:#f0f1ec;--s3:#e5e8e0;--bd:#dde1d8;--tx:#15181b;--mu:#5c656e;--mu2:#646c75;--ac:#c8f53c;--ac-ink:#101400;--ac-tx:#4a7400;--ac-soft:rgba(120,170,0,.12);--sh:0 6px 24px rgba(20,30,10,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:106.25%}@supports (font:-apple-system-body){html{font:-apple-system-body}}
html,body{margin:0;background:var(--bg);color:var(--tx);line-height:1.45;-webkit-text-size-adjust:100%}
body{font-family:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:0.882rem}
button,input,select,textarea{font:inherit;color:inherit}
#root{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.app{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:20}
.top h1{font-size:1.294rem;margin:0;font-weight:800;letter-spacing:-.3px;flex:1}
.logo{font-weight:900;letter-spacing:-.5px}.logo b{color:var(--ac-tx)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--s1);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card.tight{padding:12px}
.card.hero{background:linear-gradient(145deg,var(--s2),var(--s1));}
.card.ac{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.card h3{margin:0 0 8px;font-size:0.941rem;font-weight:700}
.sec{font-size:0.765rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sec a,.link{color:var(--ac-tx);text-decoration:none;font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0;background:none;border:0;padding:0;font-size:0.824rem}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:6px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.mu{color:var(--mu)}.mu2{color:var(--mu2)}.sm{font-size:0.765rem}.xs{font-size:0.706rem}.lg{font-size:1.059rem}.xl{font-size:1.647rem;font-weight:800;letter-spacing:-.5px}.b{font-weight:700}.c{text-align:center}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--s2);color:var(--tx);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s ease,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}.btn.full{width:100%}.btn.sm{min-height:42px;padding:8px 12px;font-size:0.765rem;border-radius:11px}
.btn.big{padding:18px;font-size:1.0rem;border-radius:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;display:inline-flex;align-items:center;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--s2);cursor:pointer;font-size:0.824rem;user-select:none}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:transparent;font-weight:700}
.seg{display:flex;background:var(--s2);border:1px solid var(--bd);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:10px;cursor:pointer;font-size:0.765rem;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:var(--sh)}
label.f{display:block;margin:0 0 12px}label.f>span{display:block;font-size:0.765rem;color:var(--mu);margin:0 0 6px;font-weight:600}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);outline:none}
.inp:focus{border-color:var(--ac-tx)}
textarea.inp{min-height:76px;resize:vertical}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:0.706rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--s3);color:var(--mu)}
.tag.ac{background:var(--ac-soft);color:var(--ac-tx)}.tag.warn{background:rgba(255,181,71,.15);color:var(--warn)}.tag.bad{background:rgba(255,93,108,.14);color:var(--bad)}.tag.good{background:rgba(95,224,160,.14);color:var(--good)}.tag.info{background:rgba(91,192,255,.14);color:var(--info)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:8px;border-radius:99px;background:var(--s3);overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .6s ease}
.stat{background:var(--s2);border-radius:14px;padding:12px;flex:1;min-width:0}
.stat .v{font-size:1.176rem;font-weight:800;letter-spacing:-.3px}.stat .k{font-size:0.706rem;color:var(--mu);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.list>*+*{border-top:1px solid var(--bd)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:0.618rem;color:var(--mu);padding:6px 0;cursor:pointer;font-weight:600}
.nav button svg{width:22px;height:22px}.nav button.on{color:var(--tx)}.nav button.on svg{color:var(--ac-tx)}
.nav .run{width:52px;height:52px;border-radius:18px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;margin:-22px auto 0;box-shadow:0 6px 20px rgba(200,245,60,.35)}
.nav .run svg{width:26px;height:26px;color:var(--ac-ink)!important}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--s1);width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--s3);margin:4px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:90;font-weight:600;font-size:0.824rem;max-width:90vw;box-shadow:var(--sh);animation:up .25s}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wkd{background:var(--s2);border-radius:12px;padding:6px 2px;text-align:center;cursor:pointer;min-height:64px;border:1.5px solid transparent;position:relative}
.wkd.today{border-color:var(--ac-tx)}.wkd .d{font-size:0.647rem;color:var(--mu)}.wkd .n{font-weight:800;font-size:0.882rem}
.wkd .bar2{height:4px;border-radius:4px;margin:4px 6px 0}
.mon{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mon .c{aspect-ratio:1;background:var(--s2);border-radius:9px;padding:3px;font-size:0.647rem;position:relative;cursor:pointer;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.mon .c.out{opacity:.35}.mon .c.today{border-color:var(--ac-tx)}
.wo{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--s1);border:1px solid var(--bd);margin-bottom:8px;cursor:pointer}
.wo .stripe{width:5px;align-self:stretch;border-radius:5px}
.wo.done{opacity:.75}.wo.missed,.wo.skipped{opacity:.5}
.stage{border-inline-start:3px solid var(--bd);padding:2px 0 2px 14px;padding-inline-start:14px;padding-left:unset;margin:0 0 14px}
.stage h4{margin:0 0 4px;font-size:0.882rem}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd);gap:12px}.kv:last-child{border-bottom:0}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word}
.msg.u{background:var(--ac);color:var(--ac-ink);margin-inline-start:auto;border-end-end-radius:6px}
.msg.a{background:var(--s2);border-end-start-radius:6px}
.banner{padding:10px 14px;border-radius:14px;font-size:0.765rem;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:rgba(255,181,71,.12);color:var(--warn)}.banner.info{background:rgba(91,192,255,.1);color:var(--info)}.banner.bad{background:rgba(255,93,108,.12);color:var(--bad)}.banner.good{background:rgba(95,224,160,.12);color:var(--good)}.banner.ac{background:var(--ac-soft);color:var(--ac-tx)}
.ob{min-height:100vh;display:flex;flex-direction:column;padding:16px 0 24px}
.ob .prog{display:flex;gap:4px;margin:6px 0 18px}.ob .prog i{flex:1;height:4px;border-radius:4px;background:var(--s3)}.ob .prog i.on{background:var(--ac)}
.ob h2{font-size:1.529rem;margin:0 0 6px;letter-spacing:-.4px}.ob .lead{color:var(--mu);margin:0 0 20px}
.opt{display:block;width:100%;text-align:start;padding:14px 16px;border-radius:16px;border:1.5px solid var(--bd);background:var(--s1);margin-bottom:10px;cursor:pointer}
.opt.on{border-color:var(--ac-tx);background:var(--ac-soft)}.opt b{display:block}.opt span{font-size:0.765rem;color:var(--mu)}
.ring{position:relative;display:grid;place-items:center}.ring>div{position:absolute;text-align:center}
.live{position:fixed;inset:0;background:#000;color:#fff;z-index:80;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.live .big{font-size:min(5.2rem,24vw);font-weight:900;letter-spacing:-3px;line-height:1}
.live .mid{font-size:2.0rem;font-weight:800;letter-spacing:-1px}
.live .lbl{font-size:0.765rem;color:#9aa;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.live .stagebox{background:#151515;border-radius:20px;padding:16px;border:2px solid #222}
.live .ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.live .ctl button{padding:22px;border-radius:20px;border:0;font-size:1.176rem;font-weight:800;cursor:pointer}
.fast{color:#ff6b6b}.slow{color:#ffc04d}.ok{color:#c8f53c}
svg text{font-family:inherit}
.empty{padding:28px 16px;text-align:center;color:var(--mu)}
.badge{background:var(--s2);border-radius:16px;padding:12px 6px;text-align:center}.badge.off{opacity:.35;filter:grayscale(1)}.badge .i{font-size:1.529rem}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
hr{border:0;border-top:1px solid var(--bd);margin:14px 0}

:focus-visible{outline:3px solid var(--ac-tx);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.hero-wo{border-radius:24px;padding:20px;background:linear-gradient(160deg,var(--s2),var(--s1) 70%);border:1px solid var(--bd);margin-bottom:14px;position:relative;overflow:hidden}
.hero-wo .kicker{font-size:.8rem;font-weight:700;letter-spacing:.4px;color:var(--mu);display:flex;align-items:center;gap:8px}
.hero-wo h2{font-size:1.75rem;line-height:1.15;margin:8px 0 4px;letter-spacing:-.5px}
.hero-wo .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.hero-wo .metrics>div{background:var(--bg);border-radius:14px;padding:10px 8px;text-align:center}
.hero-wo .metrics b{display:block;font-size:1.15rem;font-weight:800}
.hero-wo .metrics span{font-size:.72rem;color:var(--mu)}
.pace-pill{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ac-soft);color:var(--ac-tx);border-radius:14px;padding:12px 14px;font-weight:700}
.why{font-size:.9rem;color:var(--tx);opacity:.92;margin:12px 0 0}
.stack-top{display:flex;align-items:center;gap:8px;padding:14px 0 8px}
.stack-top .grow h1{font-size:1.3rem;margin:0}
.sticky-cta{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:15;padding-top:10px;background:linear-gradient(transparent,var(--bg) 40%)}
.stage-card{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--s1);border:1px solid var(--bd);margin-bottom:8px}
.stage-card .n{width:28px;height:28px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.stage-card .t{font-weight:700}
.status-tag{font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:999px}
.wo.today{border-color:var(--ac-tx);box-shadow:0 0 0 1px var(--ac-tx) inset}
.holdbtn{position:relative;overflow:hidden}
.holdbtn i{position:absolute;inset:0;background:rgba(255,255,255,.25);transform-origin:left;transform:scaleX(0)}
[dir=rtl] .holdbtn i{transform-origin:right}
.err{padding:30px 18px;text-align:center}
</style>
</head>
